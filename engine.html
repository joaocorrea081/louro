<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Motor de ditado</title>
<style>
  html, body {
    margin: 0; height: 100%;
    background: #1e1e2e; color: #cdd6f4;
    font: 13px/1.5 system-ui, sans-serif;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; user-select: none;
  }
  #state { font-size: 1.1rem; font-weight: 600; }
  #detail { opacity: 0.6; margin-top: 6px; padding: 0 12px; word-break: break-word; }
</style>
</head>
<body>
  <div id="state">iniciando…</div>
  <div id="detail"></div>

<script>
/*
 * Motor de reconhecimento de fala. Roda numa janela escondida do Chrome — a
 * interface visível e o overlay em GTK. Quem manda aqui e o bridge, por SSE:
 * este arquivo não tem botão nem atalho próprio.
 */
const stateEl = document.getElementById('state');
const detailEl = document.getElementById('detail');

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

let shouldRecord = false;   // o usuário quer estar gravando agora?
let recognition = null;
let finalText = '';         // acumulado durante o ciclo inteiro, atravessa reinicios
let restarts = 0;

// Config vem do bridge por SSE e pode mudar no meio do caminho (painel aberto
// em outra aba), então e sempre lida na hora de começar a gravar.
let config = { engine: 'chrome', language: 'pt-BR' };

// --- gravação pra OpenAI ------------------------------------------------
// No modo OpenAI quem reconhece não e o navegador: aqui só gravamos o áudio e
// entregamos os bytes pro bridge, que fala com a API (a chave nunca vem pra ca).
let recorder = null;
let recordedChunks = [];

// --- medição do volume do microfone ------------------------------------
// O reconhecimento do Chrome não expoe o nível do áudio, então abrimos um
// stream próprio só pra medir. E o que faz a bolinha reagir a voz de verdade
// em vez de piscar sozinha — sem isso não da pra saber se o microfone pegou.
let audioContext = null;
let audioStream = null;
let levelTimer = null;

async function startLevelMeter() {
  if (audioContext) return;
  try {
    audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioContext = new AudioContext();
    const source = audioContext.createMediaStreamSource(audioStream);
    const analyser = audioContext.createAnalyser();
    analyser.fftSize = 512;
    analyser.smoothingTimeConstant = 0.3;
    source.connect(analyser);

    const samples = new Float32Array(analyser.fftSize);
    levelTimer = setInterval(() => {
      analyser.getFloatTimeDomainData(samples);
      let sum = 0;
      for (const sample of samples) sum += sample * sample;
      const rms = Math.sqrt(sum / samples.length);
      // fala normal fica perto de 0.02-0.15 em RMS; normaliza pra 0..1 numa
      // curva que da pra enxergar (raiz, senao quase tudo vira "quietinho")
      const level = Math.min(1, Math.sqrt(rms / 0.25));
      navigator.sendBeacon('/level', JSON.stringify({ level }));
    }, 100);
  } catch (err) {
    report(`não consegui medir o nível do áudio: ${err.message}`, 'error');
  }
}

function stopLevelMeter() {
  if (levelTimer) clearInterval(levelTimer);
  levelTimer = null;
  if (audioStream) audioStream.getTracks().forEach((t) => t.stop());
  audioStream = null;
  if (audioContext) audioContext.close();
  audioContext = null;
}

function report(message, level = 'info') {
  detailEl.textContent = message;
  fetch('/log', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message, level }),
  }).catch(() => {});
}

function sendText(text) {
  fetch('/type', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text }),
  }).catch((err) => report(`falha ao enviar texto: ${err.message}`, 'error'));
}

function startRecognition() {
  if (!SpeechRecognition) {
    report('este navegador não reconhece fala; escolha o motor OpenAI', 'error');
    shouldRecord = false;
    return;
  }
  recognition = new SpeechRecognition();
  recognition.lang = config.language || 'pt-BR';
  recognition.continuous = true;
  recognition.interimResults = false;

  recognition.onresult = (ev) => {
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      if (ev.results[i].isFinal) finalText += ev.results[i][0].transcript;
    }
    if (finalText) report(`ouvido: ${finalText}`);
  };

  // Erros que não adianta tentar de novo: sem eles o onend reiniciaria em loop
  // apertado, enchendo o log e martelando o microfone.
  const FATAL = {
    'not-allowed': 'permissão de microfone negada',
    'service-not-allowed': 'serviço de fala bloqueado',
    'audio-capture': 'nenhum microfone disponível',
  };

  recognition.onerror = (ev) => {
    // 'no-speech' e 'aborted' são rotina: o motor corta sozinho no silêncio e
    // o onend logo abaixo reinicia.
    if (ev.error === 'no-speech' || ev.error === 'aborted') return;
    if (FATAL[ev.error]) {
      shouldRecord = false;
      report(`${FATAL[ev.error]} (${ev.error})`, 'error');
      return;
    }
    report(`erro de reconhecimento: ${ev.error}`, 'error');
  };

  recognition.onend = () => {
    recognition = null;
    if (!shouldRecord) {
      finishCycle();
      return;
    }
    // O Chrome encerra a sessão sozinho depois de um tanto de silêncio. Como o
    // usuário ainda não mandou parar, reabre e segue acumulando no mesmo texto.
    restarts++;
    if (restarts > 60) {
      report('reinícios demais, desistindo do ciclo', 'error');
      shouldRecord = false;
      finishCycle();
      return;
    }
    setTimeout(() => { if (shouldRecord) startRecognition(); }, 120);
  };

  try {
    recognition.start();
    stateEl.textContent = 'ouvindo';
  } catch (err) {
    report(`não consegui iniciar: ${err.message}`, 'error');
  }
}

function finishCycle() {
  stateEl.textContent = 'parado';
  const text = finalText.trim();
  finalText = '';
  restarts = 0;
  sendText(text);
  if (text) report(`enviado: ${text}`);
  else report('ciclo terminou sem texto');
}

async function startRecorder() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recordedChunks = [];
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = (ev) => {
      if (ev.data.size > 0) recordedChunks.push(ev.data);
    };
    recorder.onstop = () => {
      stream.getTracks().forEach((t) => t.stop());
      sendAudio();
      recorder = null;
    };
    recorder.start();
    stateEl.textContent = 'gravando (OpenAI)';
  } catch (err) {
    report(`não consegui gravar: ${err.message}`, 'error');
    shouldRecord = false;
  }
}

function sendAudio() {
  const blob = new Blob(recordedChunks, { type: recordedChunks[0]?.type || 'audio/webm' });
  recordedChunks = [];
  stateEl.textContent = 'parado';

  if (blob.size < 1000) {
    report('gravação curta demais, nada pra transcrever');
    fetch('/type', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: '' }),
    }).catch(() => {});
    return;
  }

  report(`mandando ${Math.round(blob.size / 1024)} KB pra OpenAI`);
  fetch('/transcribe', { method: 'POST', headers: { 'Content-Type': blob.type }, body: blob })
    .catch((err) => report(`falha ao enviar áudio: ${err.message}`, 'error'));
}

function onStart() {
  if (shouldRecord) return;
  finalText = '';
  restarts = 0;
  shouldRecord = true;
  startLevelMeter();
  if (config.engine === 'openai') {
    startRecorder();
  } else {
    startRecognition();
  }
}

function onStop() {
  if (!shouldRecord) return;
  shouldRecord = false;
  stopLevelMeter();
  stateEl.textContent = 'finalizando…';

  if (config.engine === 'openai') {
    if (recorder && recorder.state !== 'inactive') {
      recorder.stop();   // dispara onstop -> sendAudio
    } else {
      sendAudio();
    }
    return;
  }

  if (recognition) {
    recognition.stop();   // dispara onend -> finishCycle
  } else {
    finishCycle();
  }
}

const events = new EventSource('/events?client=page');
events.addEventListener('start', onStart);
events.addEventListener('stop', onStop);
events.addEventListener('config', (ev) => {
  try {
    config = JSON.parse(ev.data);
  } catch { /* mantem a config anterior */ }
});
events.onopen = () => {
  stateEl.textContent = 'parado';
  if (!SpeechRecognition) {
    report('este navegador não tem Web Speech API; só o motor OpenAI funciona', 'error');
  } else {
    report('motor pronto');
  }
};
events.onerror = () => { stateEl.textContent = 'sem conexão com a ponte'; };
</script>
</body>
</html>
